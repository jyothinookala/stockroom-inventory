<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | StockRoom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
<main class="auth-layout"><section class="auth-intro"><div class="brand auth-brand"><span class="brand-mark">S</span><span>Stock<strong>Room</strong></span></div><div class="intro-copy"></div></section><section class="auth-panel"><div class="auth-card"><p class="eyebrow">StockRoom</p><h2>Sign in</h2><p class="auth-help">Enter your details to view your products.</p><form id="login-form" class="auth-form"><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Enter your password"></label><a class="forgot-link" href="/forgot-password">Forgot password?</a><p class="form-error" id="form-error"></p><button class="primary-button auth-submit" type="submit">Sign in <span>→</span></button></form><p class="auth-switch">New here? <a href="/register">Create an account</a></p></div></section></main><script src="/auth.js"></script>
</body>
</html>
